[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warden"
version = "0.1.0"
description = "Cloud Security Posture Scanner for AWS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "jinja2>=3.1.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "moto[iam,s3,ec2,ecs,eks,sts]>=5.0.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["scanner*", "reports*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
